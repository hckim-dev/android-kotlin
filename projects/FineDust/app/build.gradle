plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def localConfig = new Properties()
def localConfigFile = rootProject.file("secrets.properties")
if (localConfigFile.exists()) {
    localConfigFile.withInputStream { localConfig.load(it) }
}
def clientSetting = { String name ->
    System.getenv(name) ?: localConfig.getProperty(name, "")
}

android {
    compileSdk 31

    defaultConfig {
        buildConfigField "String", "KAKAO_API_KEY", groovy.json.JsonOutput.toJson(clientSetting("KAKAO_API_KEY"))
        buildConfigField "String", "AIR_KOREA_SERVICE_KEY", groovy.json.JsonOutput.toJson(clientSetting("AIR_KOREA_SERVICE_KEY"))

        applicationId "com.hocheol.finedust"
        minSdk 23
        targetSdk 31
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    viewBinding {
        enabled = true
    }
}

dependencies {

    // Google Play Service
    implementation 'com.google.android.gms:play-services-location:18.0.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2-native-mt'

    // Retrofit2
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Okhttp3 Logging
    implementation 'com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.2'

    // SwipeLayout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0-alpha01'

    // Lifecycle-Service
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.0-beta01'
    implementation 'androidx.lifecycle:lifecycle-service:2.4.0-beta01'

    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'

    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}